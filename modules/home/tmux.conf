set -g status-style bg=default

# --- Status Bar Layout ---
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 100

# --- Colors & Glyphs (The "Pill" & "Arrow" logic) ---
# Left: [Session] > [Index] > [User] >
set -g status-left "#[fg=#CC0000,bg=default]#[bg=#CC0000,fg=#000000,bold] #S #[fg=#CC0000,bg=#990000]#[fg=#ffffff,bg=#990000] #I:#P #[fg=#990000,bg=#660000]#[fg=#cccccc,bg=#660000] #{USER} #[fg=#660000,bg=default]"

# Right: < [Time] < [Date] < [Host]
set -g status-right "#[fg=#660000,bg=default]#[bg=#660000,fg=#cccccc] %H:%M #[fg=#990000,bg=#660000]#[bg=#990000,fg=#ffffff] %d-%b #[fg=#CC0000,bg=#990000]#[bg=#CC0000,fg=#000000,bold] #H #[fg=#CC0000,bg=default]"

# Window status (The "Pills" in the center)
setw -g window-status-current-format "#[fg=#990000,bg=default]#[bg=#990000,fg=#000000,bold]#I:#W#[fg=#990000,bg=default]"
setw -g window-status-format "#[fg=#666666,bg=default] #I:#W "

# Open new windows or split windows in the CWD
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Renumber windows
set -g renumber-windows on

# --- Extended Keys ---
# Ghostty supports the kitty keyboard protocol natively; tmux just needs to
# be told to negotiate and forward extended keys rather than normalizing them.
set -g extended-keys on
set -ag terminal-features 'xterm-ghostty*:extkeys'
